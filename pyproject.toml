[project]
name = "fastapi_template"
version = "3.3.0"
description = "A Minium FastAPI Template Project"
authors = [
    { name = "jackcizon", email = "jack20021213cn@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "coverage (>=7.13.2,<8.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "faker (>=40.11.1,<41.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
    "python-docs-theme (>=2026.3,<2027.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "ratelimiter-lite (>=0.3.0,<0.4.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "boto3 (>=1.42.90,<2.0.0)",
    "reactor-server (>=2.3.0,<3.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
