name: fastapi_template_services
services:
  #  web:  # when each branch's tests pass, enable this service
  #    build: .
  #    ports:
  #      - "8000:5000"
  #    develop:
  #      watch:
  #        - action: sync
  #          path: .
  #          target: /code
  redis:
    container_name: redis_fastapi_template
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    command:
      - redis-server
      - --bind
      - "${REDIS_HOST}"
      - --protected-mode
      - "no"
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    restart: always

  postgres:
    container_name: postgresql_fastapi_template
    image: postgres:16.2
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
  redisdata:
